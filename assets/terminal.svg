<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
<style>
.scene{animation:fade 16s infinite}
#c0,#c1,#c2,#c3,.cur,#bar{animation-duration:16s;animation-iteration-count:infinite}
#c0{animation-name:c0}#c1{animation-name:c1}#c2{animation-name:c2}#c3,.cur{animation-name:c3}#bar{animation-name:bar}
